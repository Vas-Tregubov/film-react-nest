version: "3.9"

services:
  backend:
    container_name: backend
    image: ghcr.io/vas-tregubov/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      DATABASE_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - app-network

  frontend:
    container_name: frontend
    image: ghcr.io/vas-tregubov/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      VITE_API_URL: /api/afisha
      VITE_CDN_URL: /content/afisha
    volumes:
      - frontend_build:/usr/share/nginx/html
    restart: on-failure
    networks:
      - app-network

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - frontend_build:/usr/share/nginx/html
      - ./frontend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: on-failure
    networks:
      - app-network

  db:
    container_name: db
    image: postgres:17-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/test/sql_init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: on-failure
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    env_file:
      - ./.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: on-failure
    networks:
      - app-network

volumes:
  db_data:
  pgadmin_data:
  frontend_build:

networks:
  app-network:
    driver: bridge
