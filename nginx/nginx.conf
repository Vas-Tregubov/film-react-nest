events {
    worker_connections 1024;
}

http {
    # MIME types для корректной отдачи фронта
    types {
        text/html               html htm shtml;
        text/css                css;
        text/javascript         js;
        text/xml                xml;
        image/gif               gif;
        image/jpeg              jpeg jpg;
        image/png               png;
        image/svg+xml           svg svgz;
        image/webp              webp;
        application/pdf         pdf;
        font/woff               woff;
        font/woff2              woff2;
        application/x-font-ttf  ttf;
        application/x-font-opentype otf;
    }

    server {
        listen 80;
        listen [::]:80;

        server_name vas-tre-film-react-nest.nomorepartiessbs.ru;

        # редирект на HTTPS (если потом добавим SSL)
        location / {
            return 301 https://$server_name$request_uri;
        }

        # API проксируем на бэкенд
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Статика /content/ с прокси на бэкенд
        location /content/ {
            proxy_pass http://backend:3000/content/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Фронт
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
